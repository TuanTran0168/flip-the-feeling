<!-- Interactive script for minor atmospheric effects & LocalStorage -->
<script>
        // Add subtle parallax effect to the blurred background based on mouse movement
        document.addEventListener('mousemove', (e) => {
            const bg = document.querySelector('.bg-cover');
            if(bg) {
                const x = (e.clientX / window.innerWidth - 0.5) * 20;
                const y = (e.clientY / window.innerHeight - 0.5) * 20;
                bg.style.transform = `translate(${x}px, ${y}px) scale(1.05)`;
            }
        });

        // Local storage logic placeholder for saving to Archive
        function saveSongToArchive() {
            const songTitle = document.getElementById('current-song-title').innerText;
            const songData = {
                title: songTitle,
                artist: "Bùi Anh Tuấn",
                timestamp: new Date().toISOString()
            };
            
            let archive = JSON.parse(localStorage.getItem('tuaniverse_archive') || '[]');
            const exists = archive.find(s => s.title === songData.title);
            
            const btn = document.getElementById('save-btn');
            
            if (!exists) {
                archive.push(songData);
                localStorage.setItem('tuaniverse_archive', JSON.stringify(archive));
                
                // Visual feedback
                if(btn) {
                    btn.innerHTML = `<span class="material-symbols-outlined text-sm" data-icon="bookmark_added">bookmark_added</span> Đã Lưu`;
                    btn.classList.add('text-tertiary', 'border-tertiary');
                }
                console.log('Saved to archive:', songData);
            } else {
                console.log('Song already in archive');
            }
        }
    </script>
