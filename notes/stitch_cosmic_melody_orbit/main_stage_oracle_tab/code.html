<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Mystic Cosmic Background Effects */
        .cosmic-bg {
            background: radial-gradient(circle at 20% 50%, rgba(79, 61, 114, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 80% 30%, rgba(233, 196, 0, 0.05) 0%, transparent 40%),
                        #131313;
        }
        
        /* Simulated 3D Orbit Elements (CSS fallback for Three.js requirement in prompt) */
        .orbit-container {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 800px;
            height: 800px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 1px dashed rgba(233, 196, 0, 0.1);
            animation: spin 120s linear infinite;
            z-index: 0;
            pointer-events: none;
        }
        .orbit-container-2 {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 1200px;
            height: 1200px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 1px dashed rgba(233, 196, 0, 0.05);
            animation: spin-reverse 180s linear infinite;
            z-index: 0;
            pointer-events: none;
        }
        .planet {
            position: absolute;
            top: 0;
            left: 50%;
            width: 8px;
            height: 8px;
            background-color: #e9c400;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 15px rgba(233, 196, 0, 0.8);
        }
        .sun {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, #ffe16d 0%, rgba(233, 196, 0, 0.2) 70%, transparent 100%);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 100px rgba(233, 196, 0, 0.4);
            z-index: 0;
        }

        @keyframes spin { 100% { transform: translate(-50%, -50%) rotate(360deg); } }
        @keyframes spin-reverse { 100% { transform: translate(-50%, -50%) rotate(-360deg); } }

        /* Tarot Cards Animation */
        .tarot-deck {
            perspective: 1000px;
        }
        .tarot-card {
            transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
            transform-origin: bottom center;
        }
        .tarot-card:hover {
            transform: translateY(-20px) scale(1.05);
            box-shadow: 0 0 30px rgba(233, 196, 0, 0.3);
            z-index: 10;
        }
        .card-center { transform: rotate(0deg); z-index: 3; }
        .card-left { transform: rotate(-15deg) translateX(-20px); z-index: 2; }
        .card-right { transform: rotate(15deg) translateX(20px); z-index: 2; }
        .card-bottom { transform: translateY(40px) scale(0.9); z-index: 1; opacity: 0.8; }
        
        .tarot-pattern {
            background-image: radial-gradient(rgba(233, 196, 0, 0.1) 1px, transparent 1px);
            background-size: 10px 10px;
        }

        /* Glassmorphism utility */
        .glass-panel {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            background: rgba(30, 30, 35, 0.4);
            border: 1px solid rgba(233, 196, 0, 0.2);
